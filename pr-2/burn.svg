nd API calls.</text><text x="786.0" y="430.0" font-family="sans-serif" font-size="14" fill="#58a6ff" text-anchor="start">Learn more in FinOps-Guard Docs ↗</text><rect x="30.0" y="500.0" width="1140.0" height="300.0" rx="12.0" fill="#161b22" stroke="#30363d" stroke-width="1.0"/><rect x="30" y="500" width="6" height="300" rx="3" fill="#f85149"/><circle cx="70" cy="540" r="14" fill="#f85149"/><text x="70.0" y="545.0" font-family="sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="98.0" y="547.0" font-family="sans-serif" font-size="22" fill="#e6edf3" text-anchor="start" font-weight="bold">🎯 WANTED: OpenAI API Call in Loop</text><rect x="1058.0" y="524.0" width="62.0" height="30.0" rx="15.0" fill="#2d1618" stroke="#f85149" stroke-width="1.0"/><text x="1089.0" y="544.0" font-family="sans-serif" font-size="13" fill="#f85149" text-anchor="middle" font-weight="bold">HIGH</text><text x="70.0" y="592.0" font-family="sans-serif" font-size="15" fill="#8b949e" text-anchor="start">🔍 Scanning ./examples/ingest_pipeline.py for loop-bound API calls…</text><text x="70.0" y="620.0" font-family="sans-serif" font-size="15" fill="#e6edf3" text-anchor="start">🚨 1 issue(s) found:</text><rect x="70.0" y="640.0" width="1060.0" height="130.0" rx="8.0" fill="#0d1117" stroke="#5c2b2b" stroke-width="1.0"/><text x="92.0" y="674.0" font-family="monospace" font-size="15" fill="#f85149">[FG-001] ./examples/ingest_pipeline.py:9 (openai)</text><rect x="1000.0" y="652.0" width="108.0" height="30.0" rx="6.0" fill="#161b22" stroke="#30363d" stroke-width="1.0"/><text x="1054.0" y="672.0" font-family="sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle">View file ↗</text><text x="92.0" y="712.0" font-family="monospace" font-size="15" fill="#e6edf3">response = </text><text x="191.0" y="712.0" font-family="monospace" font-size="15" fill="#ff7b72">openai.chat.completions.create(</text><text x="92.0" y="748.0" font-family="sans-serif" font-size="14" fill="#8b949e" text-anchor="start">API call inside a loop can lead to unexpected costs and rate limit issues.</text><rect x="30.0" y="830.0" width="1140.0" height="200.0" rx="12.0" fill="#0f1a12" stroke="#238636" stroke-width="1.0"/><text x="70.0" y="878.0" font-family="sans-serif" font-size="18" fill="#3fb950" text-anchor="start" font-weight="bold">💡 Recommended Action</text><circle cx="82" cy="913.0" r="3" fill="#3fb950"/><text x="98.0" y="918.0" font-family="sans-serif" font-size="15" fill="#e6edf3" text-anchor="start">Batch requests or cache responses instead of calling per-iteration</text><circle cx="82" cy="949.0" r="3" fill="#3fb950"/><text x="98.0" y="954.0" font-family="sans-serif" font-size="15" fill="#e6edf3" text-anchor="start">Add rate limiting and per-run cost monitoring</text><circle cx="82" cy="985.0" r="3" fill="#3fb950"/><text x="98.0" y="990.0" font-family="sans-serif" font-size="15" fill="#e6edf3" text-anchor="start">Summarize multiple items in a single API call where possible</text><rect x="930.0" y="895.0" width="210.0" height="44.0" rx="8.0" fill="#0f1a12" stroke="#238636" stroke-width="1.0"/><text x="1035.0" y="922.0" font-family="sans-serif" font-size="14" fill="#3fb950" text-anchor="middle" font-weight="bold">Learn Best Practices ↗</text><text x="600.0" y="1085.0" font-family="sans-serif" font-size="15" fill="#8b949e" text-anchor="middle">FinOps-Guard helps you build cost-aware. Safe today, scalable tomorrow. 💚</text></svg>