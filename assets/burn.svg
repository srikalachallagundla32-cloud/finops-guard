<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes pulseGauge { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
      .gauge-text  { font-family: 'Courier New', monospace; font-size: 11px; fill: #AFA9EC; }
      .gauge-value { font-family: 'Courier New', monospace; font-size: 20px; font-weight: bold; fill: #5DCAA5; }
      .gauge-label { font-family: 'Courier New', monospace; font-size: 13px; font-weight: bold; fill: #5DCAA5; letter-spacing: 1px; }
      .arc         { animation: pulseGauge 1.6s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="320" height="200" fill="#0d0713" />

  <!-- Track -->
  <path d="M 50 140 A 110 110 0 0 1 270 140" stroke="#2a1a35" stroke-width="9" fill="none" stroke-linecap="round" />

  <!-- Active arc (proportional to cost/budget) -->
  <path d="M 50 140 A 110 110 0 0 1 50.00 139.95" stroke="#5DCAA5" stroke-width="9" fill="none" class="arc" stroke-linecap="round" />

  <!-- Needle (static coords — no CSS transform) -->
  <line x1="64.00" y1="139.95" x2="160.00" y2="140.00" stroke="#5DCAA5" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="160" cy="140" r="5" fill="#0d0713" stroke="#5DCAA5" stroke-width="2" />

  <!-- Tick labels -->
  <text x="46" y="162" class="gauge-text" text-anchor="end">0%</text>
  <text x="160" y="18" class="gauge-text" text-anchor="middle">50%</text>
  <text x="274" y="162" class="gauge-text" text-anchor="start">100%</text>

  <!-- Cost (left) -->
  <text x="20" y="40" class="gauge-value">$0.01</text>
  <text x="20" y="58" class="gauge-text">/ $50.00</text>

  <!-- Status (right) -->
  <text x="300" y="90" class="gauge-label" text-anchor="end">SAFE</text>
  <text x="300" y="110" class="gauge-text" text-anchor="end">0% used</text>

  <!-- Issues (bottom-left) -->
  <text x="20" y="188" class="gauge-text">1 issue</text>
</svg>